name: PR

# PR 流水线：提 PR 或推开发分支时，自动跑后端 lint + 测试、前端 lint + 构建。
on:
  # PR 合入主干前的最后一道门：目标分支是 main 就触发，与源分支名无关
  pull_request:
    branches: [main]
  # 开发分支每次推送即验证；用通配符，以后拉 develop-V0.2 / develop-V1.0 都不用改这里
  push:
    branches: ['develop-*']

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # pnpm 要先装（setup-node 的 cache: pnpm 依赖它），版本与本地保持一致
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxlint 查逻辑 + prettier --check 查格式，与本地 pnpm lint 完全一致
      - name: Lint (oxlint + prettier)
        run: pnpm lint

      # tsc -b 类型检查 + vite build
      - name: Build (tsc -b && vite build)
        run: pnpm build
